[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puppy"
version = "0.1.0"
description = ""
requires-python = ">=3.10"
dependencies = [
    "wpilib==2026.2.2",
    "robotpy-ctre==2026.1.0.1",
	"robotpy==2026.2.2"
]

[project.optional-dependencies]
test = [
	"pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
